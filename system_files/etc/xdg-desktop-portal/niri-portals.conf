# Override of /usr/share/xdg-desktop-portal/niri-portals.conf (from the niri
# package). It changes two lines, Secret and FileChooser.
#
# Secret: the niri default points it at gnome-keyring, which tishy does not
# install -- so Brave/Chromium's portal-based os_crypt key retrieval failed and
# it lost saved logins every session. Point it at kwallet (the KWallet portal
# backend, kwallet.portal) so it uses the same already-running, already-unlocked
# wallet as the KDE session. screencast etc. stay on gnome
# (xdg-desktop-portal-gnome); access on gtk.
#
# FileChooser must be pinned explicitly: with only `default=gnome;gtk;` it
# resolves to the gnome backend, whose file chooser delegates to Nautilus. tishy
# doesn't install Nautilus, so file pickers (e.g. "Open file" in a browser) would
# fail rather than fall through to gtk. Dux Files (dfiles.portal) comes first so
# pickers match the DMS theme. gtk is used only if dfiles.portal is missing;
# xdg-desktop-portal does not fall back to it if Dux Files is installed but
# crashes or doesn't respond, so a broken Dux Files means broken file pickers
# under niri. To go back to the gtk picker for one account, copy
# this file to ~/.config/xdg-desktop-portal/ and drop `dfiles;` from the line.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.FileChooser=dfiles;gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=kwallet;
