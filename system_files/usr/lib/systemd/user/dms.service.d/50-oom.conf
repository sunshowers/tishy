# Keep DMS up under memory pressure. DMS recovers from being killed
# (dms.service is Restart=on-failure, back within ~1.2 s), so this aims to make
# that rare rather than impossible.
#
# OOMPolicy=continue: with the default OOMPolicy=stop, the kernel OOM-killing
# one process in this unit's cgroup makes systemd stop the whole unit, taking
# DMS down with it. That happened on 2026-10-29.
#
# ManagedOOMPreference=avoid: systemd-oomd (monitoring user@.service for memory
# pressure on Fedora) only picks this cgroup if there's no other candidate.
# Not omit: DMS restarts, so memory pressure oomd is barred from relieving is
# worse than a brief restart.
#
# OOMScoreAdjust=100 is the lowest oom_score_adj an unprivileged user unit can
# set, since the user manager itself runs at 100; other user units default to
# 200. Unlike niri, DMS's shell is big enough (~700 MB) for this to matter to
# the kernel OOM killer. Apps launched from DMS run in their own app-dms-*.scope
# units but would inherit this score; DMS's launchPrefix setting runs them
# under `choom -n 200` to give them the normal score back (set in the skel
# ~/.config/dms/settings.json).
[Service]
OOMPolicy=continue
OOMScoreAdjust=100
ManagedOOMPreference=avoid
