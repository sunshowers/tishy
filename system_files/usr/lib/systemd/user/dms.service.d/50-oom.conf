# Apps launched from the DMS launcher inherit this unit's cgroup. With the
# default OOMPolicy=stop, the kernel OOM-killing one of them (e.g. a browser
# renderer) makes systemd stop the whole unit, taking DMS down with it. That
# happened on 2026-10-29.
#
# 100 is the lowest oom_score_adj an unprivileged user unit can set, since the
# user manager itself runs at 100. Most other user processes sit at 200.
[Service]
OOMPolicy=continue
OOMScoreAdjust=100
