# Keep niri alive under memory pressure. niri is the one session process that
# can't come back: niri.service is Restart=no, and when it exits the session
# ends and takes every app with it. (DMS, by contrast, restarts itself; see
# dms.service.d/50-oom.conf.)
#
# OOMPolicy=continue: with the default OOMPolicy=stop, the kernel OOM-killing
# any process in this unit's cgroup (e.g. xwayland-satellite, which niri runs
# inside it) would make systemd stop niri and end the session.
#
# ManagedOOMPreference=omit: systemd-oomd (monitoring user@.service for memory
# pressure on Fedora) kills whole cgroups, and must never pick this one. The
# man page asks for omit to be used sparingly; a session-ending, non-restarting
# unit is the case it exists for. It only covers this unit's own cgroup: apps
# niri spawns run in their own app-niri-*.scope units and stay fair game. oomd
# honors it here because the unit's cgroup and the monitored user@.service
# cgroup have the same owner (see systemd.resource-control(5)).
#
# OOMScoreAdjust=100 is the lowest oom_score_adj an unprivileged user unit can
# set, since the user manager itself runs at 100; other user units default to
# 200. It matters little for niri (the kernel OOM killer ranks mostly by memory
# use, and niri is small), and niri's children inherit it, but that costs
# little for the same reason: they're nearly always bigger than niri.
[Service]
OOMPolicy=continue
OOMScoreAdjust=100
ManagedOOMPreference=omit
