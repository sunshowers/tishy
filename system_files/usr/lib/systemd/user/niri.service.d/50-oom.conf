# With the default OOMPolicy=stop, the kernel OOM-killing any helper in this
# unit's cgroup (e.g. xwayland-satellite) would make systemd stop niri and end
# the session.
#
# 100 is the lowest oom_score_adj an unprivileged user unit can set, since the
# user manager itself runs at 100. Most other user processes sit at 200.
[Service]
OOMPolicy=continue
OOMScoreAdjust=100
