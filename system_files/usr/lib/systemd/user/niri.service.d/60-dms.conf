# Start DankMaterialShell (bar, launcher, notifications, lock screen) as part of
# the niri session.
#
# dms.service ships with WantedBy=graphical-session.target, but enabling it that
# way would also start DMS under the KDE/Plasma session. Pulling it in from
# niri.service instead scopes it to niri, while still running it as a proper
# unit: it gets Restart=on-failure and the OOMPolicy drop-in in
# dms.service.d/50-oom.conf, neither of which a `spawn-at-startup` child gets.
#
# Ordering needs no extra directives here: dms.service is already
# After=graphical-session.target, which niri.service is Before=.
[Unit]
Wants=dms.service
